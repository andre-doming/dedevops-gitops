nameOverride: ""
fullnameOverride: ""

workload:
  type: api
  replicas: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  enabled: true
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  host: ""
  ingressClassName: nginx
  tls:
    enabled: true
    clusterIssuer: dedevops-ca

probes:
  enabled: true
  path: /api/health
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true

env: []
