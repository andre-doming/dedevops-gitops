fullnameOverride: dedevops-api

workload:
  type: api
  replicas: 2

container:
  name: dedevops-api

selectorLabels:
  app: dedevops-api

image:
  repository: ghcr.io/andre-doming/dedevops-api
  tag: sha-97a3f3d
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  enabled: true
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: api.dedevops
  ingressClassName: nginx
  tls:
    enabled: true
    clusterIssuer: dedevops-ca
    secretName: api-dedevops-tls

probes:
  enabled: true
  path: /api/health
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true
  nameOverride: allow-dev-to-dedevops-api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

env:
  - name: Application__Version
    value: "sha-97a3f3d"
