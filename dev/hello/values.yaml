fullnameOverride: hello-gitops

workload:
  type: api
  replicas: 1

container:
  name: hello
  args:
    - "-text=DEDEVOPS - GITOPS FUNCIONANDO"

selectorLabels:
  app: hello-gitops

image:
  repository: hashicorp/http-echo
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  enabled: true
  port: 80
  targetPort: 5678

ingress:
  enabled: false

probes:
  enabled: false

networkPolicy:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
