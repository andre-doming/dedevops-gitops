fullnameOverride: partnersolution-api

workload:
  type: api
  replicas: 1

container:
  name: partnersolution-api

selectorLabels:
  app: partnersolution-api

image:
  repository: ghcr.io/andre-doming/partnersolution-api
  tag: sha-d3256da30781f51d8356c3e358c0a57add8e0905
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  enabled: true
  port: 80
  targetPort: 8080

ingress:
  enabled: false

probes:
  enabled: true
  path: /health
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true
  nameOverride: allow-infra-ingress-to-partnersolution-api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: AllowedHosts
    value: partnersolution.dedevops
  - name: App__PublicBaseUrl
    value: https://partnersolution.dedevops
